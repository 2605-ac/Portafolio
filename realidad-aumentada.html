<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AR DRIVE — Realidad Aumentada</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:transparent;color:white}#intro{position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at top,#382037,#101014 65%);display:grid;place-items:center;padding:24px}.panel{max-width:560px;width:100%;padding:32px;border:1px solid #ffffff30;border-radius:24px;background:#17171e;text-align:center}h1{font-size:clamp(45px,10vw,80px);letter-spacing:-4px;margin:12px 0;color:#ffa9d2}p{color:#d0c6d0;line-height:1.6}.tag{font-size:12px;letter-spacing:3px;color:#ffa9d2}button,a.link{display:inline-block;background:#ffa9d2;color:#241321;border:0;border-radius:30px;padding:14px 22px;font-weight:bold;cursor:pointer;text-decoration:none;margin:6px}a.link{background:transparent;border:1px solid #ffa9d2;color:#ffa9d2}#hud{position:fixed;z-index:5;top:15px;left:15px;right:15px;display:none;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}#hud>*{pointer-events:auto}#status{background:#15151ee8;border-radius:16px;padding:14px;font-size:13px}#sceneHost{position:fixed;inset:0}body{overflow:hidden}a-scene{width:100%;height:100%}#hint{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:5;background:#15151ee8;padding:12px 20px;border-radius:20px;text-align:center;width:max-content;max-width:90vw;font-size:13px}
</style>
</head><body>
<div id="intro"><div class="panel"><div class="tag">09 / TALLER DE INTERFACES</div><h1>AR DRIVE</h1><p>REALIDAD AUMENTADA</p><p>Descubre un automóvil tridimensional en tu entorno. Activa la cámara y apunta al marcador Hiro impreso o visible en otra pantalla.</p><button id="start">ACTIVAR CÁMARA</button><a class="link" href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank" rel="noopener">VER MARCADOR</a><p id="error" role="alert"></p></div></div>
<div id="hud"><div id="status">Buscando marcador…</div><button id="stop">SALIR</button></div><div id="hint">Apunta al marcador Hiro para revelar el auto.</div><div id="sceneHost"></div>
<script>
const intro=document.getElementById('intro'),host=document.getElementById('sceneHost'),hud=document.getElementById('hud'),statusEl=document.getElementById('status'),hint=document.getElementById('hint'),error=document.getElementById('error');
function wheel(x,z){return `<a-entity position="${x} 0.18 ${z}" rotation="0 0 90"><a-cylinder radius="0.18" height="0.15" color="#15151b" segments-radial="32"></a-cylinder><a-cylinder radius="0.105" height="0.16" color="#b8bcc8" metalness="0.7"></a-cylinder></a-entity>`;}
function start(){if(!navigator.mediaDevices?.getUserMedia){error.textContent='Abre la página mediante HTTPS o Live Server para usar la cámara.';return;}intro.style.display='none';hud.style.display='flex';hint.style.display='block';host.innerHTML=`<a-scene embedded vr-mode-ui="enabled:false" renderer="antialias:true;alpha:true" arjs="sourceType:webcam;debugUIEnabled:false;trackingMethod:best;"><a-marker preset="hiro" id="marker" smooth="true" emitevents="true"><a-entity scale="0.8 0.8 0.8"><a-box position="0 0.22 0" width="0.86" height="0.25" depth="1.75" color="#e92867" metalness="0.45" roughness="0.25"></a-box><a-box position="0 0.40 0.05" width="0.69" height="0.29" depth="0.82" color="#252b40" metalness="0.3"></a-box><a-box position="0 0.56 0.05" width="0.72" height="0.055" depth="0.85" color="#e92867"></a-box><a-box position="0 0.29 -0.68" width="0.8" height="0.10" depth="0.38" color="#e92867"></a-box>${wheel(-0.44,-0.56)}${wheel(0.44,-0.56)}${wheel(-0.44,0.56)}${wheel(0.44,0.56)}<a-box position="-0.27 0.25 -0.88" width="0.23" height="0.09" depth="0.035" color="#fff4d2" material="emissive:#fff4d2;emissiveIntensity:0.6"></a-box><a-box position="0.27 0.25 -0.88" width="0.23" height="0.09" depth="0.035" color="#fff4d2" material="emissive:#fff4d2;emissiveIntensity:0.6"></a-box><a-box position="-0.27 0.25 0.88" width="0.23" height="0.08" depth="0.035" color="#ff1515"></a-box><a-box position="0.27 0.25 0.88" width="0.23" height="0.08" depth="0.035" color="#ff1515"></a-box></a-entity></a-marker><a-entity camera></a-entity></a-scene>`;const marker=document.getElementById('marker');marker.addEventListener('markerFound',()=>{statusEl.textContent='✓ Marcador detectado';hint.textContent='Mueve el marcador para explorar el auto en 3D.'});marker.addEventListener('markerLost',()=>{statusEl.textContent='Buscando marcador…';hint.textContent='Apunta al marcador Hiro para revelar el auto.'});}
const button=document.getElementById('start');
function load(url){return new Promise((resolve,reject)=>{const script=document.createElement('script');let timer=setTimeout(()=>{script.remove();reject(new Error('Tiempo de espera agotado: '+url))},30000);script.src=url;script.onload=()=>{clearTimeout(timer);resolve()};script.onerror=()=>{clearTimeout(timer);script.remove();reject(new Error('No se pudo descargar '+url))};document.head.appendChild(script)})}
async function loadAny(urls,check){let last;for(const u of urls){try{await load(u);if(check())return;last=new Error('La librería se descargó pero no se registró: '+u)}catch(e){last=e}}throw last}
let ready=false;
button.onclick=async()=>{button.disabled=true;try{if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)throw new Error('Abre con Live Server en localhost o HTTPS.');if(!ready){error.textContent='Cargando A-Frame 1.6.0…';if(!window.AFRAME)await loadAny(['https://aframe.io/releases/1.6.0/aframe.min.js','https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js'],()=>!!window.AFRAME);error.textContent='Cargando AR.js 3.4.7…';const registered=()=>!!(window.AFRAME?.systems?.arjs||window.AFRAME?.components?.arjs||window.AFRAME?.components?.arjsanchor);if(!registered())await loadAny(['https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js','https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js'],registered);ready=true;}error.textContent='';start();}catch(e){error.textContent=e.message;console.error(e)}finally{button.disabled=false}};document.getElementById('stop').onclick=()=>{document.querySelectorAll('video').forEach(v=>v.srcObject?.getTracks().forEach(t=>t.stop()));location.reload()};window.addEventListener('camera-error',()=>{statusEl.textContent='No se pudo activar la cámara. Revisa los permisos.'});
</script></body></html>
